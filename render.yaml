services:
  - type: web
    name: peerly
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_ROOM_SIZE
        value: "8"
      # Lets calls resume across deploys and restarts. Render generates it once.
      - key: SESSION_SECRET
        generateValue: true
      # Optional: AI-written meeting notes on Groq's free tier
      # (https://console.groq.com/keys). Without it Peerly writes the notes itself.
      - key: GROQ_API_KEY
        sync: false
      # Optional TURN relay for strict NATs - see README "TURN server".
      # - key: TURN_URL
      #   sync: false
      # - key: TURN_SECRET
      #   sync: false
