services:
  - type: web
    name: peerly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: MAX_ROOM_SIZE
        value: "8"
      # Optional TURN relay for strict NATs - see README "TURN server" section.
      # - key: TURN_URL
      #   sync: false
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false
