<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting - Peerly</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6ef7'/%3E%3Cpath d='M7 11a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3V11zm14 3.5 4.2-2.8a1 1 0 0 1 1.55.83v7.94a1 1 0 0 1-1.55.83L21 18.5v-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="room-body">

  <!-- ============ PRE-JOIN LOBBY ============ -->
  <div id="lobby" class="lobby">
    <a class="brand lobby-brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4f6ef7"/>
        <path d="M7 11a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3V11zm14 3.5 4.2-2.8a1 1 0 0 1 1.55.83v7.94a1 1 0 0 1-1.55.83L21 18.5v-4z" fill="#fff"/>
      </svg>
      <span>Peerly</span>
    </a>

    <div class="lobby-content">
      <div class="lobby-preview">
        <div class="preview-frame">
          <video id="previewVideo" autoplay playsinline muted></video>
          <div id="previewPlaceholder" class="preview-placeholder">
            <div class="avatar avatar-lg" id="previewAvatar">?</div>
            <p id="previewStatus">Camera is off</p>
          </div>
          <div class="preview-controls">
            <button id="lobbyMicBtn" class="ctrl-btn" data-on="true" title="Toggle microphone" aria-label="Toggle microphone"></button>
            <button id="lobbyCamBtn" class="ctrl-btn" data-on="true" title="Toggle camera" aria-label="Toggle camera"></button>
          </div>
        </div>
        <div class="device-selects">
          <label>
            <span>Microphone</span>
            <select id="micSelect"><option>Default microphone</option></select>
          </label>
          <label>
            <span>Camera</span>
            <select id="camSelect"><option>Default camera</option></select>
          </label>
        </div>
        <p id="mediaWarning" class="media-warning" hidden></p>
      </div>

      <div class="lobby-join">
        <h1>Ready to join?</h1>
        <p class="lobby-room-line">Room <span id="lobbyRoomId" class="room-code"></span></p>
        <p id="lobbyOccupancy" class="lobby-occupancy">Checking room...</p>
        <input id="nameInput" type="text" maxlength="30" placeholder="Your name" aria-label="Your name" autocomplete="name">
        <button id="joinRoomBtn" class="btn btn-primary btn-lg" disabled>Join now</button>
        <p id="joinError" class="landing-error" hidden></p>
      </div>
    </div>
  </div>

  <!-- ============ CALL UI ============ -->
  <div id="call" class="call" hidden>
    <header class="call-header">
      <div class="call-header-left">
        <svg class="brand-mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#4f6ef7"/>
          <path d="M7 11a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3V11zm14 3.5 4.2-2.8a1 1 0 0 1 1.55.83v7.94a1 1 0 0 1-1.55.83L21 18.5v-4z" fill="#fff"/>
        </svg>
        <span id="callRoomId" class="room-code"></span>
        <button id="copyLinkBtn" class="chip-btn" title="Copy meeting link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy link
        </button>
      </div>
      <div class="call-header-right">
        <span id="recIndicator" class="rec-indicator" hidden><span class="rec-dot"></span>REC</span>
        <span id="callTimer" class="call-timer">00:00</span>
      </div>
    </header>

    <main class="call-main">
      <div id="videoGrid" class="video-grid"></div>

      <!-- Chat panel -->
      <aside id="chatPanel" class="side-panel" hidden>
        <div class="panel-header">
          <h2>Chat</h2>
          <button class="icon-btn panel-close" data-close="chatPanel" aria-label="Close chat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
        <form id="chatForm" class="chat-form" autocomplete="off">
          <input id="chatInput" type="text" maxlength="2000" placeholder="Send a message" aria-label="Chat message">
          <button type="submit" class="icon-btn chat-send" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
      </aside>

      <!-- Participants panel -->
      <aside id="peoplePanel" class="side-panel" hidden>
        <div class="panel-header">
          <h2>Participants <span id="peopleCount"></span></h2>
          <button class="icon-btn panel-close" data-close="peoplePanel" aria-label="Close participants">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <ul id="peopleList" class="people-list"></ul>
      </aside>

      <!-- Keyboard shortcuts overlay -->
      <div id="shortcutsOverlay" class="shortcuts-overlay" hidden>
        <div class="shortcuts-card">
          <h2>Keyboard shortcuts</h2>
          <dl>
            <div><dt>M</dt><dd>Toggle microphone</dd></div>
            <div><dt>V</dt><dd>Toggle camera</dd></div>
            <div><dt>H</dt><dd>Raise or lower hand</dd></div>
            <div><dt>C</dt><dd>Open or close chat</dd></div>
            <div><dt>P</dt><dd>Open or close participants</dd></div>
            <div><dt>?</dt><dd>Show this help</dd></div>
          </dl>
          <button class="btn btn-ghost" id="shortcutsClose">Close</button>
        </div>
      </div>
    </main>

    <footer class="call-controls">
      <div class="controls-group">
        <button id="micBtn" class="ctrl-btn" data-on="true" title="Toggle microphone (M)" aria-label="Toggle microphone"></button>
        <button id="camBtn" class="ctrl-btn" data-on="true" title="Toggle camera (V)" aria-label="Toggle camera"></button>
        <button id="shareBtn" class="ctrl-btn ctrl-neutral" title="Share screen" aria-label="Share screen">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M12 14V8m0 0l-3 3m3-3l3 3"/></svg>
        </button>
        <button id="handBtn" class="ctrl-btn ctrl-neutral" title="Raise hand (H)" aria-label="Raise hand">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11m0-1V4.5a1.5 1.5 0 0 0-3 0V10m0 .5v-6a1.5 1.5 0 0 0-3 0V12m9-1.5v2a7.5 7.5 0 0 1-7.5 7.5h-.36a6 6 0 0 1-5.06-2.78L3.5 13.5a1.63 1.63 0 0 1 2.6-1.95L7.5 13"/></svg>
        </button>
        <button id="recordBtn" class="ctrl-btn ctrl-neutral" title="Record meeting" aria-label="Record meeting">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="leaveBtn" class="ctrl-btn ctrl-danger" title="Leave call" aria-label="Leave call">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11l-1.27 1.27"/><path d="M22 2L2 22" stroke-width="2.4"/></svg>
        </button>
      </div>
      <div class="controls-group controls-right">
        <button id="chatBtn" class="ctrl-btn ctrl-neutral has-badge" title="Chat (C)" aria-label="Toggle chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="chatBadge" class="badge" hidden></span>
        </button>
        <button id="peopleBtn" class="ctrl-btn ctrl-neutral has-badge" title="Participants (P)" aria-label="Toggle participants">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="peopleBadge" class="badge badge-neutral"></span>
        </button>
      </div>
    </footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
